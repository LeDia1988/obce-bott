name: Denná kontrola obcí
on:
  schedule:
    - cron: "15 3 * * *"   # 5:15 v zime / 6:15 v lete (SK čas)
  workflow_dispatch:
    inputs:
      rediscover:
        description: Nanovo nájsť podstránky obcí
        default: "false"
permissions:
  contents: write
concurrency: obce-bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Inštalácia poppler-utils (pdftotext)
        continue-on-error: true   # bez PDF textu radšej beh dokončiť, než celý zlyhať
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing poppler-utils && break
            echo "apt pokus $i zlyhal, opakujem o 20 s"; sleep 20
          done
          command -v pdftotext || echo "::warning::pdftotext nie je k dispozícii – PDF sa tento beh nespracujú"
      - run: pip install -q requests beautifulsoup4 lxml
      - run: python bot.py ${{ github.event.inputs.rediscover == 'true' && '--rediscover' || '' }}
      - name: Obstarávania, výzvy, zmluvy
        run: python zdroje.py
        continue-on-error: true
      - name: Uložiť výsledky
        run: |
          git config user.name "obce-bot"
          git config user.email "obce-bot@users.noreply.github.com"
          git add data
          git commit -m "Kontrola $(date +%F)" || echo "bez zmien"
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
