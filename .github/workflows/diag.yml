name: Diagnostika zdrojov (pomôcka)
on:
  workflow_dispatch:
    inputs:
      urls: { description: "URL oddelené čiarkou" }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq poppler-utils || true
      - run: pip install -q requests beautifulsoup4 lxml
      - run: python tools/diag.py "${{ github.event.inputs.urls }}"
      - run: |
          git init -q o && cp -r diag_out o/ && cd o
          git config user.name obce-bot && git config user.email obce-bot@users.noreply.github.com
          git checkout -q -b diag-data && git add -A && git commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-data
