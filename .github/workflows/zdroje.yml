name: Len obstarávania a výzvy (ručne)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: obce-bot-zdroje
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests beautifulsoup4 lxml
      - run: python zdroje.py
      - run: |
          git config user.name "obce-bot"
          git config user.email "obce-bot@users.noreply.github.com"
          git add data
          git commit -m "Zdroje $(date +%F)" || echo "bez zmien"
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
